name: Release check

# Runs when a version tag is pushed, and fails if the tag is not the plugin's version, or the changelog has no
# entry for it. Nothing is published: a maintainer creates the GitHub release from the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the plugin version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/check_release.py "$TAG"
