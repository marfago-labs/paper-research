name: Badges

# Publishes the numbers that CI measured on main, for the README's coverage and scenario badges. It runs only after
# a push to main has passed CI, never for a pull request, so a change that has not been reviewed cannot write here.
# The badges are small JSON files on a branch of their own, which shields.io reads.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# Two pushes to main close together would both clone the badges branch, and the second push would be rejected.
concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the badge numbers
    # In whichever repository CI ran: each one publishes to its own badges branch, with its own token.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the badges branch
      actions: read # download the artifacts of the CI run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-numbers
          path: coverage-numbers
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scenario-numbers
          path: scenario-numbers
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Write the badge files
        run: python tools/badges.py --coverage coverage-numbers/*.json --junit scenario-numbers --out badges
      - name: Push them to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          # The token goes in a header for each command, so it is never written to .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          if git -c "http.extraheader=$auth" ls-remote --exit-code --heads "$remote" badges > /dev/null; then
            git -c "http.extraheader=$auth" clone --quiet --depth 1 --branch badges "$remote" site
          else
            git init --quiet site
            git -C site checkout --quiet --orphan badges
            git -C site remote add origin "$remote"
          fi
          cp badges/*.json site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the badges have not changed"
            exit 0
          fi
          git commit --quiet -m "Badge numbers of ${SHA:0:7}"
          git -c "http.extraheader=$auth" push --quiet origin badges
