name: Mutation tests

# Mutation testing changes the code in small ways and checks that a test notices each change. It takes a
# long time (about 35 minutes for the graph script), so it runs weekly and on request, not on every push.
# A module whose code, tests, and tooling haven't changed since it last passed is skipped.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Run every module, even those unchanged since they last passed"
        type: boolean
        default: false

concurrency:
  group: mutation
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # to look up the pass markers of earlier runs

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  mutation:
    name: Mutation tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Survival limits in percent, set just above what was measured on 2026-11-07. They are a
          # ratchet: lower them when survivors are killed, never raise them.
          # paths: everything besides the shared tooling that can change the module's result.
          - {module: init, limit: 1, paths: "skills/init .claude-plugin/plugin.json"}
          - {module: recap, limit: 6, paths: "skills/recap skills/graph/scripts/graph.py"}
          - {module: arxiv, limit: 19, paths: "skills/arxiv/scripts"}
          - {module: s2, limit: 22, paths: "skills/scholar/scripts"}
          - {module: graph, limit: 19, paths: "skills/graph/scripts"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The fingerprint is a hash of the tracked files the result depends on, plus the survival limit.
      # A run that passes uploads a marker artifact named after it, so an identical later run can skip.
      - name: Fingerprint the code under test
        id: fingerprint
        env:
          MODULE: ${{ matrix.module }}
          LIMIT: ${{ matrix.limit }}
          PATHS: ${{ matrix.paths }}
        run: |
          # shellcheck disable=SC2086 # PATHS is a space-separated list of paths
          hash=$(git ls-files -s -- $PATHS tools requirements-dev.txt "mutation/$MODULE.toml" \
            .github/workflows/mutation.yml | sha256sum | cut -c1-20)
          echo "name=mutation-passed-$MODULE-limit$LIMIT-$hash" >> "$GITHUB_OUTPUT"

      - name: Look for an earlier pass with the same fingerprint
        id: earlier
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.fingerprint.outputs.name }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "$found" -gt 0 ]; then
            echo "::notice::Unchanged since it last passed ($NAME), so skipped. Run the workflow with force to re-test."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.earlier.outputs.passed != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - if: steps.earlier.outputs.passed != 'true'
        run: pip install --require-hashes -r requirements-dev.txt
      - if: steps.earlier.outputs.passed != 'true'
        env:
          MODULE: ${{ matrix.module }}
          LIMIT: ${{ matrix.limit }}
        run: python tools/run_mutation.py "$MODULE" --max-survival "$LIMIT"

      - name: Record the pass
        if: steps.earlier.outputs.passed != 'true'
        env:
          NAME: ${{ steps.fingerprint.outputs.name }}
        run: echo "$NAME" > pass-marker.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.earlier.outputs.passed != 'true'
        with:
          name: ${{ steps.fingerprint.outputs.name }}
          path: pass-marker.txt
